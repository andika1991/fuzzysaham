{% extends 'admin/layout/base.html' %}
{% set active_menu = 'rule' %}

{% block content %}

<div class="container mt-4">
    <h4 class="mb-3">➕ Tambah Rule</h4>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- FUNDAMENTAL -->
                    <div class="col-md-4 mb-3">
                        <label>EPS</label>
                        <input type="text" name="eps" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>PER</label>
                        <input type="text" name="per" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>ROE</label>
                        <input type="text" name="roe" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>DER</label>
                        <input type="text" name="der" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>FCF</label>
                        <input type="text" name="fcf" class="form-control">
                    </div>

                    <!-- TEKNIKAL -->
                    <div class="col-md-4 mb-3">
                        <label>MA50</label>
                        <input type="text" name="ma50" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>MA200</label>
                        <input type="text" name="ma200" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Volume</label>
                        <select name="volume" class="form-control">
                            <option value="">-- Pilih --</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>RSI</label>
                        <select name="rsi" class="form-control">
                            <option value="">-- Pilih --</option>
                            <option value="oversold">Oversold</option>
                            <option value="netral">Netral</option>
                            <option value="overbought">Overbought</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Sentimen</label>
                        <select name="sentimen" class="form-control">
                            <option value="">-- Pilih --</option>
                            <option value="positif">Positif</option>
                            <option value="netral">Netral</option>
                            <option value="negatif">Negatif</option>
                        </select>
                    </div>

                    <!-- OUTPUT -->
                    <div class="col-md-4 mb-3">
                        <label>Output</label>
                        <select name="output" class="form-control" required>
                            <option value="">-- Pilih --</option>
                            <option value="bullish">Bullish</option>
                            <option value="bearish">Bearish</option>
                            <option value="sideways">Sideways</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Horizon</label>
                        <select name="horizon" class="form-control" required>
                            <option value="">-- Pilih --</option>
                            <option value="short">Short</option>
                            <option value="medium">Medium</option>
                            <option value="long">Long</option>
                        </select>
                    </div>

                </div>

                <div class="mt-3">
                    <button class="btn btn-success">💾 Simpan</button>
                    <a href="{{ url_for('admin_rule.index') }}" class="btn btn-secondary">Kembali</a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
